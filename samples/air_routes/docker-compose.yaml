services:
  app:
    image: graph-explorer-app
    ports:
      - "127.0.0.1:8081:80"
    environment:
      - HOST=localhost
      - GRAPH_TYPE=gremlin
      - PROXY_SERVER_HTTPS_CONNECTION=false
      - GRAPH_CONNECTION_URL=http://database:8182

  database:
    image: tinkerpop/gremlin-server:3.8
    volumes:
      - ./sample:/opt/gremlin-server/sample:ro
    entrypoint: /opt/gremlin-server/bin/gremlin-server.sh
    command: /opt/gremlin-server/sample/conf/gremlin-server-air-routes.yaml
